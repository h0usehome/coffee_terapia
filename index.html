if(DB.used.includes(c))return["bad","Этот код уже использован"];
if(!VALID.includes(c))return["bad","Код не найден. Проверьте и попробуйте снова"];
DB.used.push(c);DB.cups++;DB.hist.unshift({d:day(),n:"Кружка добавлена"});if(!DB.visits.includes(day()))DB.visits.push(day());save();

const addBar=(k,l)=>`<div class="sticky"><button class="bt" data-act="aform" data-p="${k}" data-i="-1">${l}</button></div>`;
const NOTE=`<div class="m" style="line-height:1.5">В этой версии изменения хранятся только на этом устройстве. Чтобы их видели все гости, подключается сервер.</div>`;
const FORMS={news:{t:"Новость",b:"anews",f:[["title","Заголовок","text"],["text","Текст","area"],["pin","Закрепить вверху","bool"]]},item:{t:"Позиция меню",b:"amenu",f:[["name","Название","text"],["desc","Описание","text"],["price","Цена (число)","text"],["rub","Цена в рублях (иначе в комплиментах)","bool"],["vol","Объём или вес, например 200 мл","text"],["img","Ссылка на фото (необязательно)","text"]]},event:{t:"Вечер",b:"aevents",f:[["title","Название","text"],["tag","Исполнитель или формат","text"],["date","Дата","date"],["time","Время","text"]]},cat:{t:"Новая категория",b:"amenu",f:[["name","Название","text"]]}};
const src=(k,i)=>i<0?{}:k==="news"?Object.assign({},NEWS[i]):k==="event"?Object.assign({},EVENTS[i]):k==="item"?(x=>({name:x.n,desc:x.d,price:String(x.p).replace(".",","),rub:x.u==="r"?1:0,vol:x.v||"",img:x.img||"",art:x.art||""}))(MENU[S.acat][i]):{};
const rf=()=>{FORMS[S.form.kind].f.forEach(f=>{if(f[2]!=="bool"){const el=$("#f_"+f[0]);if(el)S.form.v[f[0]]=el.value}})};
function fsave(){rf();const F=S.form,v=F.v,i=F.i,k=F.kind,need=k==="news"?v.title:(k==="item"||k==="cat")?v.name:(v.title&&v.date);
if(!String(need||"").trim()){S.msg=["bad","Заполните обязательные поля"];return}
if(k==="news"){const o={id:v.id||"n"+Date.now(),title:v.title.trim(),text:(v.text||"").trim(),pin:v.pin?1:0,date:v.date||day()};i>=0?NEWS[i]=o:NEWS.unshift(o)}
else if(k==="item"){const a={n:v.name.trim(),d:(v.desc||"").trim(),p:parseFloat(String(v.price||"0").replace(",","."))||0,u:v.rub?"r":"k",v:(v.vol||"").trim(),img:(v.img||"").trim(),art:v.art||""};i>=0?MENU[S.acat][i]=a:MENU[S.acat].push(a)}
else if(k==="event"){const o={id:v.id||"e"+Date.now(),title:v.title.trim(),tag:(v.tag||"").trim(),date:v.date,time:(v.time||"19:00").trim(),occ:v.occ||[]};i>=0?EVENTS[i]=o:EVENTS.push(o);EVENTS.sort((a,b)=>a.date.localeCompare(b.date))}
else{const n=v.name.trim();if(!MENU[n])MENU[n]=[];S.acat=n}
saveCT();S.sub=F.b;S.msg=null}
const tile=(s,t,d)=>`<button class="k" style="text-align:left" data-sub="${s}"><b>${t}</b><div class="m" style="margin-top:4px">${d}</div></button>`;
Object.assign(V,{
news:()=>`${hdr("Новости")}${sortN().map(x=>newsCard(x,1)).join("")}`,
newsitem:()=>{const x=NEWS.find(n=>n.id===S.p);if(!x)return hdr("Новость");const d=dd(x.date);return `${hdr("Новость")}<div class="k col"><div class="m">${d.n} ${d.m}</div><b style="font-size:18px">${esc(x.title)}</b><div style="white-space:pre-wrap;line-height:1.5">${esc(x.text)}</div></div>`},
admin:()=>`${hdr("Администратор")}${NOTE}${tile("anews","Новости","Добавить и изменить новости на главной")}${tile("amenu","Меню","Позиции, цены, описания и фото")}${tile("aevents","Вечера","Название, дата и время")}`,
anews:()=>`${hdr("Новости")}${sortN().map(x=>rowA(x.title,(x.pin?"Закреплено · ":"")+x.date,"news",NEWS.indexOf(x))).join("")||'<div class="m">Новостей пока нет</div>'}${addBar("news","Добавить новость")}`,
amenu:()=>{if(!MENU[S.acat])S.acat=Object.keys(MENU)[0];return `${hdr("Меню")}<div class="row hs" style="gap:8px">${Object.keys(MENU).map(k=>`<button class="ch ${k===S.acat?"on":""}" data-act="acat" data-p="${esc(k)}">${esc(k)}</button>`).join("")}<button class="ch" data-act="aform" data-p="cat" data-i="-1">+ Категория</button></div>${MENU[S.acat].map((x,i)=>rowA(x.n,esc(fmtP(x)),"item",i)).join("")||'<div class="m">В категории пока пусто</div>'}${addBar("item","Добавить позицию")}`},
aevents:()=>`${hdr("Вечера")}${EVENTS.map((e,i)=>rowA(e.title,e.date+" · "+e.time,"event",i)).join("")}${addBar("event","Добавить вечер")}`,
form:()=>{const F=FORMS[S.form.kind],v=S.form.v;return `${hdr(F.t)}${S.msg?`<div class="msg bad" role="alert">${S.msg[1]}</div>`:""}${F.f.map(f=>f[2]==="bool"?`<button class="ch ${v[f[0]]?"on":""}" data-act="ftog" data-p="${f[0]}" style="align-self:flex-start">${f[1]}${v[f[0]]?": да":""}</button>`:`<div><label class="lb" for="f_${f[0]}">${f[1]}</label>${f[2]==="area"?`<textarea id="f_${f[0]}" class="fl" rows="5">${esc(v[f[0]]||"")}</textarea>`:`<input id="f_${f[0]}" class="fl" type="${f[2]==="date"?"date":"text"}" value="${esc(v[f[0]]||"")}">`}</div>`).join("")}<div class="sticky"><button class="bt" data-act="fsave">Сохранить</button></div>`}
});

/* ===== Профиль ===== */
function stats(){const v=[...new Set(DB.visits)].sort(),ws=[...new Set(v.map(widx))].sort((a,b)=>a-b);let best=0,run=0,p=null;ws.forEach(x=>{run=p!==null&&x===p+1?run+1:1;if(run>best)best=run;p=x});
let rw=0;for(let n=1;n<=DB.cups;n++)if(REW[((n-1)%CUPS_MAX)+1])rw++;
const wd=[0,0,0,0,0,0,0];v.forEach(x=>wd[new Date(x+"T12:00:00").getDay()]++);const mx=Math.max(...wd),fav=mx?["воскресенье","понедельник","вторник","среду","четверг","пятницу","субботу"][wd.indexOf(mx)]:"";
const bk=Object.keys(DB.book).filter(k=>EVENTS.some(e=>e.id===k)&&(DB.book[k]||[]).length);
return{rw,best,fav,visits:v.length,first:v[0],bk}}
const tgl2=(k,l,sub)=>`<div class="row sb"><div style="min-width:0"><b>${l}</b><div class="m">${sub}</div></div><button class="tgl ${CFG[k]?"on":""}" role="switch" aria-checked="${!!CFG[k]}" aria-label="${l}" data-act="ptog" data-p="${k}"><i></i></button></div>`;
V.profile=()=>{const u=inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,nm=u&&u.first_name?u.first_name:"Гость",st=stats(),sk=streak();
const mine=st.bk.map(k=>{const e=EVENTS.find(x=>x.id===k),d=dd(e.date),b=DB.book[k],n=b.length,tb=[...new Set(b.map(x=>x[0]))].join(", ");return `<div class="k col" style="gap:14px"><div class="row"><div class="dt"><b>${d.n}</b><span>${d.ms}</span></div><div style="min-width:0"><b>${esc(e.title)}</b><div class="m" style="margin-top:2px">${d.w}, ${e.time} · ${n} ${pl(n,["место","места","мест"])}, стол ${tb}</div></div></div><div class="row" style="gap:8px"><button class="bt o" style="height:42px;font-size:14px" data-act="ev" data-p="${e.id}">Изменить</button><button class="bt o" style="height:42px;font-size:14px;color:var(--mu);border-color:var(--bd2)" data-act="cancelp" data-p="${e.id}">Отменить</button></div></div>`}).join("");
const hist=DB.hist.slice(0,5).map(x=>`<div class="row sb" style="padding:10px 0;border-top:1px solid var(--bd)"><span style="font-size:14px">${x.n}</span><span class="m">${x.d}</span></div>`).join("");
return `<h1 class="h">Профиль</h1>
<div class="k row" style="gap:16px"><div class="av">${esc(nm[0].toUpperCase())}</div><div style="min-width:0"><b style="font-size:18px">${esc(nm)}</b><div class="m" style="margin-top:2px">${u&&u.username?"@"+esc(u.username)+" · ":""}${st.first?"с нами с "+dd(st.first).n+" "+dd(st.first).m:"пока без визитов"}</div></div></div>
<div class="sec"><h2 class="st">Статистика</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="k stat"><b>${DB.cups}</b><span class="m">кружек всего</span></div><div class="k stat"><b>${st.rw}</b><span class="m">наград получено</span></div>
<div class="k stat"><b>${sk}</b><span class="m">${pl(sk,["неделя","недели","недель"])} подряд</span></div><div class="k stat"><b>${st.best}</b><span class="m">рекорд серии, недель</span></div></div>
<div class="k col" style="gap:0">${[["Визитов в кофейню",st.visits],["Записей на вечера",st.bk.length],["Любимый день",st.fav||"—"]].map((r,i)=>`<div class="row sb" style="padding:12px 0;${i?"border-top:1px solid var(--bd)":""}"><span class="m" style="font-size:14px">${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div></div>
<div class="sec"><h2 class="st">Мои записи на вечера</h2>${mine||'<div class="k m">Пока нет записей. Запишитесь на вечер во вкладке «Вечера».</div>'}</div>
<div class="sec"><h2 class="st">Последние кружки</h2><div class="k" style="padding:6px 18px">${hist||'<div class="m" style="padding:14px 0">Пока пусто. Добавьте код с чека.</div>'}</div></div>
<div class="sec"><h2 class="st">Настройки</h2><div class="k col"><div><b style="display:block;margin-bottom:10px">Тема</b><div class="seg" role="group" aria-label="Тема">${[["auto","Авто"],["light","Светлая"],["dark","Тёмная"]].map(x=>`<button class="${CFG.theme===x[0]?"on":""}" data-act="theme" data-p="${x[0]}">${x[1]}</button>`).join("")}</div></div>${tgl2("anim","Анимации","Плавные переходы между экранами")}</div></div>
${isAdmin()?'<button class="bt" data-sub="admin">Панель администратора</button>':""}
<button class="bt o" style="color:var(--mu);border-color:var(--bd2)" data-act="wipe">Удалить мои данные на этом устройстве</button>
${inTg&&!ADMINS.length?`<div class="m">Ваш Telegram ID: ${uid()}</div>`:""}`};

/* ===== Навигация и отрисовка ===== */
let lastKey="";
function render(){if(["admin","anews","amenu","aevents","form"].includes(S.sub)&&!isAdmin())S.sub=null;const v=$("#view"),key=S.tab+"|"+S.sub;
v.innerHTML=V[S.sub||S.tab]();v.classList.toggle("sub",!!S.sub);
if(key!==lastKey){v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter");window.scrollTo(0,0);lastKey=key}
const tb=$("#tabs");tb.style.display=S.sub?"none":"flex";
tb.innerHTML=TABS.map(t=>t[0]==="home"?`<button class="hb ${S.tab==="home"?"on":""}" data-go="home" aria-label="Главная"><span class="hc">${ic(t[2],26)}</span><span style="margin-top:2px">${t[1]}</span></button>`:`<button class="${t[0]===S.tab?"on":""}" data-go="${t[0]}">${ic(t[2])}${t[1]}</button>`).join("");
if(inTg){S.sub?tg.BackButton.show():tg.BackButton.hide()}}
function back(){if(!S.sub){S.tab="home";return}S.sel=[];S.msg=null;S.sub=S.sub==="form"?S.form.b:({anews:"admin",amenu:"admin",aevents:"admin"}[S.sub]||null)}
document.addEventListener("click",e=>{
const sx=e.target.closest("[data-seat]");
if(sx){if(sx.dataset.st==="o")return;const id=sx.dataset.seat,i=S.sel.indexOf(id);if(i>=0)S.sel.splice(i,1);else if(S.sel.length<6)S.sel.push(id);render();return}
const t=e.target.closest("[data-go],[data-act],[data-sub]");if(!t)return;const d=t.dataset,a=d.act;
if(d.go){S.tab=d.go;S.sub=null}
else if(d.sub){S.sub=d.sub;S.msg=null}
else if(a==="back")back();
else if(a==="ev"){S.p=d.p;S.sel=(DB.book[d.p]||[]).slice();S.sub="seats"}
else if(a==="clear")S.sel=[];
else if(a==="book"){DB.book[S.p]=S.sel.slice();save();S.sub="done"}
else if(a==="cancel"){delete DB.book[S.p];save();S.sub=null}
else if(a==="cancelp"){const m="Отменить запись на этот вечер?",id=d.p,ok=()=>{delete DB.book[id];save();render()};(inTg&&tg.showConfirm)?tg.showConfirm(m,y=>y&&ok()):(confirm(m)&&ok());return}
else if(a==="wait"){DB.wait[d.p]=1;save()}
else if(a==="cat")S.cat=d.p;
else if(a==="rtt")S.rtt=d.p;
else if(a==="route")open("https://yandex.ru/maps/?rtext=~"+encodeURIComponent(ADDR)+"&rtt="+S.rtt);
else if(a==="map")open("https://yandex.ru/maps/?text="+encodeURIComponent(ADDR));
else if(a==="copy"){try{navigator.clipboard.writeText(ADDR);if(inTg)tg.showAlert("Адрес скопирован")}catch(x){}return}
else if(a==="newsopen"){S.p=d.p;S.sub="newsitem"}
else if(a==="acat")S.acat=d.p;
else if(a==="aform"){const i=+d.i;S.form={kind:d.p,i:i,v:src(d.p,i),b:FORMS[d.p].b};S.msg=null;S.sub="form"}
else if(a==="ftog"){rf();S.form.v[d.p]=S.form.v[d.p]?0:1}
else if(a==="fsave")fsave();
else if(a==="adel"){const i=+d.i,k=d.p,m="Удалить? Это действие нельзя отменить.",ok=()=>{if(k==="news")NEWS.splice(i,1);else if(k==="event")EVENTS.splice(i,1);else MENU[S.acat].splice(i,1);saveCT();render()};(inTg&&tg.showConfirm)?tg.showConfirm(m,y=>y&&ok()):(confirm(m)&&ok());return}
else if(a==="theme"){CFG.theme=d.p;LS.s("tcfg",CFG);applyTheme()}
else if(a==="ptog"){CFG[d.p]=CFG[d.p]?0:1;LS.s("tcfg",CFG);applyTheme()}
else if(a==="wipe"){const m="Удалить кружки, записи и историю на этом устройстве?",ok=()=>{Object.assign(DB,EMPTY());save();render()};(inTg&&tg.showConfirm)?tg.showConfirm(m,y=>y&&ok()):(confirm(m)&&ok());return}
else if(a==="addcode"){S.code=$("#code").value;S.msg=addCode(S.code);if(S.msg[0]==="ok")S.code="";}
else if(a==="scan"){if(inTg&&tg.showScanQrPopup){tg.showScanQrPopup({text:"Наведите на QR с чека"},txt=>{const m=String(txt).toUpperCase().match(/TR-[A-Z0-9]{4}-[0-9]{2}/);S.msg=addCode(m?m[0]:txt);render();return true})}else{S.msg=["bad","Сканер доступен только внутри Telegram. Введите код вручную"]}}
render()});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.seat){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
/* Запрет масштабирования */
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(CFG.theme==="auto"){applyTheme();render()}})}catch(e){}
if(inTg)tg.BackButton.onClick(()=>{back();render()});
applyTheme();render();syncCloud();
</script>
</body>
</html>
